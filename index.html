      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && typeof desc.get === 'function' && !desc.set && desc.configurable) {
            var origGet = desc.get;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: function () {
                return origGet.call(window);
              },
              set: function () {
                // Ignore browser extension attempts to overwrite getter-only window.fetch.
              },
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var src = event.filename || '';
            var stack = (event.error && event.error.stack) || '';
            if (
              src.indexOf('chrome-extension://') === 0 ||
              stack.indexOf('chrome-extension://') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
